# SITE_SPEC.example.yaml — Acme Business Solutions (template defaults)
# Few-shot reference for ChatGPT fill. Maps to src/config/* on main.

archetype: consultant

site:
  name: Acme Business Solutions
  url: https://example.com
  industry: Professional Services
  positioning: Growth Partner
  tagline: Helping businesses grow with clarity and confidence
  supportingTaglines:
    - Strategy that moves the needle
    - Design that builds trust
    - Technology that scales with you
  shortDescription: >-
    We partner with small and mid-size businesses to deliver practical strategy,
    design, and technology.
  longDescription: >-
    Acme Business Solutions is a full-service consultancy focused on outcomes that
    matter. From brand positioning to digital experiences, we help teams move faster
    with less friction. Our approach blends research, craftsmanship, and measurable
    results so you can focus on running your business.
  language: en
  locale: en-US
  author: Acme Business Solutions
  defaultOgImage: public/og-default.svg
  # Prefer a branded photo in src/assets → raster.og.default for production shares (1200×630).
  defaultOgImageAlt: Acme Business Solutions
  branding:
    primary: "#1e40af"
    secondary: "#0f766e"
    accent: "#f59e0b"
    additionalAccent: "#0ea5e9"
    preferredStyle: Modern
    themeMode: light
    neutrals:
      text: "#0f172a"
      textMuted: "#64748b"
      background: "#f8fafc"
      backgroundDeep: "#020617"
      border: "#e2e8f0"
  designRules:
    - Use generous padding between sections; avoid overcrowding pages.
    - Prefer real photography over excessive iconography.
    - Use rounded corners on cards, media blocks, buttons, and forms.

company:
  email: hello@example.com
  phone: "+1 (555) 123-4567"
  officeHours: Monday–Friday, 9:00 AM – 5:00 PM
  footerBrandStatement: >-
    We partner with growing businesses to deliver practical strategy, design, and technology.
  messaging: null
  address:
    street: 123 Market Street, Suite 400
    city: San Francisco
    region: CA
    country: United States
    postalCode: "94105"
  social:
    linkedin: https://linkedin.com/company/example
    facebook: https://facebook.com/example
    instagram: https://instagram.com/example
    twitter: https://x.com/example
    youtube: https://youtube.com/@example
    tiktok: ""
  targetAudience: >-
    Founders and operators at growing companies who need a reliable partner for brand,
    web, and go-to-market work without hiring a full in-house team.
  differentiators:
    - Senior-led engagements on every project
    - Fixed-scope packages with transparent pricing
    - Launch-ready deliverables in weeks, not months
    - Ongoing support after go-live

navigation:
  headerCta:
    label: Get in touch
    href: /contact

services:
  - id: strategy
    slug: business-strategy
    name: Business Strategy
    shortDescription: >-
      Clarify positioning, messaging, and priorities so your team can execute with confidence.
    description: >-
      Clarify positioning, messaging, and priorities so your team can execute with confidence.
    benefits:
      - Market and competitor research
      - Customer persona development
