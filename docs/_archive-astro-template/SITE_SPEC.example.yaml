form:
  provider: formsubmit
  endpoint: hello@example.com
  subject: New website inquiry
  title: Send us a message
  successMessage: >-
    Thank you — your message has been sent. We will respond within one business day.
  errorMessage: Something went wrong. Please try again or email us directly.
  fields:
    - { name: fullName, label: Full Name, type: text, required: true, halfWidth: true }
    - { name: businessName, label: Business Name, type: text, halfWidth: true }
    - { name: email, label: Email Address, type: email, required: true, halfWidth: true }
    - { name: phone, label: Phone, type: tel, halfWidth: true }
    - { name: serviceNeeded, label: Service Needed, type: select, optionsFrom: services }
    - { name: consultationDate, label: Preferred Consultation Date, type: date }
    - { name: consultationTime, label: Preferred Consultation Time, type: select, optionsFrom: consultationTimes }
    - { name: message, label: Message, type: textarea, required: true, placeholder: Tell us about your goals and timeline. }
    # Optional file upload example:
    # - { name: attachment, label: Attachment, type: file, hint: PDF or image, max 5MB, accept: "image/*,.pdf", maxSizeMb: 5 }

