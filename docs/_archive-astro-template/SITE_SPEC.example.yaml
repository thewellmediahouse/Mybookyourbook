# Optional Shopify headless shop. Catalog/credentials via PUBLIC_SHOPIFY_* env — not here.
# Sample Acme site enables shop (coming-soon until Storefront env is set). Set null + pages.shop false when unused.
shop:
  preview:
    eyebrow: Shop
    heading: Browse our products
    paragraph: >-
      Explore selected items from our online store. Checkout is handled securely by Shopify.
    viewAll:
      label: View all products
      href: /shop
    button:
      label: Browse the store
      href: /shop
    image:
      src: /images/hero.svg
      alt: Online store preview placeholder
  live:
    eyebrow: Online store
    heading: Shop
    headingHighlight: our products
    paragraph: >-
      Browse the catalog below. Add items to your cart on this site, then complete payment
      on Shopify’s secure checkout.
    secondaryCtas:
      - label: Contact us
        href: /contact
  comingSoon:
    eyebrow: Coming soon
    heading: Online store
    headingHighlight: on the way
    paragraph: >-
      We’re preparing a branded product catalog with secure Shopify checkout. Meanwhile,
      get in touch for product enquiries.
    primaryCta:
      label: Contact us
      href: /contact
    image:
      src: /images/hero.svg
      alt: Online store coming soon placeholder
    note: Connect Shopify Storefront credentials to publish live products.
    categories:
      - Featured
      - New arrivals
      - Essentials
  cart:
    heading: Your cart
    paragraph: Review items here. Payment is completed on Shopify’s secure checkout.
    emptyHeading: Your cart is empty
    emptyParagraph: Browse the store and add products when you’re ready.
    browseLabel: Browse the store
  product:
    checkoutHint: >-
      Select options if shown, add items to your cart on this site, then pay on Shopify’s
      secure checkout.
    secondaryCtas:
      - label: Ask about this product
        href: /contact
  addonPricing: null

