      layout: fullBleed
      heading: Helping businesses grow with clarity and confidence
      subheading: Strategy, design, and technology under one roof
      paragraph: >-
        We partner with growing businesses to deliver practical outcomes—clear positioning,
        polished digital experiences, and systems that support long-term growth.
      primaryCta: { label: Get started, href: /contact }
      secondaryCta: { label: Our services, href: /services }
