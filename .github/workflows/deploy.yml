name: Deploy Worker

# OpenNext on Workers. Git push must OpenNext-build, then deploy Worker cineyou.
# Official: https://opennext.js.org/cloudflare/howtos/dev-deploy
# Official: https://developers.cloudflare.com/workers/ci-cd/external-cicd/github-actions/

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-cineyou
  cancel-in-progress: false

env:
  CLOUDFLARE_ACCOUNT_ID: 9664d6a341ee02a3dc21db99dc992c61
  NEXT_PUBLIC_APP_URL: https://production30.thewellmedia.com
  NEXT_PUBLIC_APP_NAME: Production30
  NEXT_TELEMETRY_DISABLED: "1"
  NODE_OPTIONS: --max-old-space-size=6144

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Require CLOUDFLARE_API_TOKEN
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::GitHub secret CLOUDFLARE_API_TOKEN is missing. Create a Cloudflare API token with Edit Cloudflare Workers, then add it as a repository secret. Do not use wrangler login — Actions cannot use OAuth."
            exit 1
          fi

      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Add swap for OpenNext
        run: |
          sudo fallocate -l 8G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=8192
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: OpenNext build
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run build

      - name: Deploy cineyou
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run cf:deploy
