name: Deploy Worker

# Official: https://opennext.js.org/cloudflare/howtos/dev-deploy
# Official: https://developers.cloudflare.com/workers/ci-cd/external-cicd/github-actions/
#
# This runner only typechecks. The GitHub CLOUDFLARE_API_TOKEN cannot publish
# a Worker version (deploy dies in ~3s; no new version appears on cineyou).
# Recreate that secret with Account → Workers Scripts → Edit, scoped to
# account 9664d6a341ee02a3dc21db99dc992c61, plus Account → Queues → Edit.
# Until then, ship from a laptop: npm run deploy
#
# Do not point `npm run build` at OpenNext. OpenNext calls `npm run build`.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-cineyou
  cancel-in-progress: false

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run check
