name: Deploy Worker

# Official: https://opennext.js.org/cloudflare/howtos/dev-deploy
# Official: https://developers.cloudflare.com/workers/ci-cd/external-cicd/github-actions/
#
# GitHub-hosted ubuntu-latest has ~7 GB RAM. opennextjs-cloudflare build is
# cancelled here every time after ~3.5 minutes (exit 143 / "operation canceled").
# Do not run OpenNext on this runner. Deploy from a machine with more RAM:
#   npm run deploy
# or connect Worker cineyou to Cloudflare Workers Builds.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-cineyou
  cancel-in-progress: false

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run check
